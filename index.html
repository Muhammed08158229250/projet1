<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wall Clock</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      color: #f7f4ed; background: radial-gradient(circle at 50% 35%, #26354b, #101722 70%);
    }
    main { text-align: center; padding: 2rem; }
    .clock {
      width: min(76vw, 360px); aspect-ratio: 1; border-radius: 50%; position: relative;
      margin: 0 auto 1.6rem; border: 10px solid #d7d0bd;
      background: radial-gradient(circle, #263141 0 5px, transparent 6px), #172231;
      box-shadow: 0 0 0 8px #435064, 0 24px 60px #0008, inset 0 0 28px #0008;
    }
    .mark { position: absolute; left: 50%; top: 50%; width: 4px; height: 12px; background: #c9c2b2; transform-origin: center; border-radius: 4px; }
    .mark.major { height: 20px; width: 6px; background: #f3c969; }
    .number { position: absolute; color: #f7f4ed; font-size: clamp(1rem, 5vw, 1.5rem); font-weight: 600; transform: translate(-50%, -50%); }
    .hand { position: absolute; left: 50%; bottom: 50%; border-radius: 99px; transform-origin: bottom; }
    .hour { width: 8px; height: 25%; background: #f7f4ed; }
    .minute { width: 5px; height: 34%; background: #d8d0bd; }
    .second { width: 2px; height: 39%; background: #f3c969; }
    .pin { position: absolute; width: 16px; height: 16px; border-radius: 50%; left: 50%; top: 50%; background: #f3c969; transform: translate(-50%, -50%); }
    #digital { font-size: clamp(2.2rem, 10vw, 4rem); font-variant-numeric: tabular-nums; letter-spacing: .06em; }
    #date { margin-top: .35rem; color: #b9c2d0; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main aria-label="Live wall clock">
    <div class="clock" role="img" aria-label="Analog clock">
      <div id="marks"></div>
      <div id="numbers"></div>
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="pin"></div>
    </div>
    <div id="digital" aria-live="off">--:--:--</div>
    <div id="date"></div>
  </main>
  <script>
    const clock = document.querySelector('.clock');
    const marks = document.getElementById('marks');
    const numbers = document.getElementById('numbers');
    for (let i = 0; i < 60; i++) {
      const mark = document.createElement('span');
      mark.className = `mark${i % 5 === 0 ? ' major' : ''}`;
      mark.style.transform = `translate(-50%, -50%) rotate(${i * 6}deg) translateY(calc(-1 * (min(76vw, 360px) / 2 - 28px)))`;
      marks.append(mark);
    }
    for (let n = 1; n <= 12; n++) {
      const label = document.createElement('span');
      const angle = (n * 30 - 90) * Math.PI / 180;
      label.className = 'number';
      label.textContent = n;
      label.style.left = `${50 + 39 * Math.cos(angle)}%`;
      label.style.top = `${50 + 39 * Math.sin(angle)}%`;
      numbers.append(label);
    }
    const pad = n => String(n).padStart(2, '0');
    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
      const minutes = now.getMinutes() + seconds / 60;
      const hours = (now.getHours() % 12) + minutes / 60;
      document.getElementById('second').style.transform = `translateX(-50%) rotate(${seconds * 6}deg)`;
      document.getElementById('minute').style.transform = `translateX(-50%) rotate(${minutes * 6}deg)`;
      document.getElementById('hour').style.transform = `translateX(-50%) rotate(${hours * 30}deg)`;
      document.getElementById('digital').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      document.getElementById('date').textContent = new Intl.DateTimeFormat(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).format(now);
      requestAnimationFrame(updateClock);
    }
    updateClock();
  </script>
</body>
</html>
